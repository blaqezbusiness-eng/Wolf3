    slot: 0
  revoke-vote:
    material: PAPER
    slot: 1
  seer-book:
    material: BOOK
    slot: 0
  witch-poison:
    material: POTION
    slot: 1
  witch-heal:
    material: POTION
    slot: 2
  hunter-target:
    material: COMPASS
    slot: 0
  werewolf-axe:
    material: NETHERITE_AXE
    slot: 0
  werewolf-armor:
    material: NETHERITE_CHESTPLATE
    slot: 0
  role-info-book:
