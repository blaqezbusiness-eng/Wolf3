name: Werewolf
version: 1.0.0
main: com.werewolf.game.WerewolfPlugin
api-version: 1.16
authors: [Werewolf]
description: Werewolf minigame plugin
commands:
  werewolf:
    description: Werewolf main command
    aliases: [ww]
    usage: /ww <subcommand>
permissions:
  werewolf.admin:
    description: Admin commands
    default: op
  werewolf.settings:
    description: Change lobby settings (roles, maps, entertaining, visibility)
    default: op
  werewolf.play:
    description: Join games
    default: true
